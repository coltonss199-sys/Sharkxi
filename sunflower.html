<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Seed So Small</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one 16:9 cutaway of sky over soil; the camera starts on the buried line and pulls back as the sunflower grows */
:root {
  /* the scene */
  --sky: #BCE0EC;
  --sun: #FFE89A;
  --petal: #FFC633;
  --petal-deep: #F39A1E;
  --disk: #5B3A21;
  --kernel: #D9A25C;
  --leaf: #82C35E;
  --soil: #8C5D3A;
  --soil-deep: #714629;
  --cream: #FFF5DA;
  --ink: #2C1D12;
  /* the page around it */
  --page: #FFD54F;
  --page-ink: #2C1D12;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --ui: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #24170E; --page-ink: #FFF5DA; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #24170E; --page-ink: #FFF5DA; color-scheme: dark; }

html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--page-ink);
  font-family: var(--ui);
  display: grid;
  place-items: center;
  padding-block: 28px;
  padding-inline: 16px;
  box-sizing: border-box;
}
.wrap { width: 100%; max-width: 1120px; display: grid; gap: 20px; }

.stage {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--sky);
  border: 3px solid var(--page-ink);
  border-radius: 22px;
  box-shadow: 0 8px 0 var(--page-ink);
  overflow: hidden;
  cursor: pointer;
  box-sizing: border-box;
}
.stage svg { display: block; width: 100%; height: 100%; }

/* SVG paint, all from the tokens */
.f-sky { fill: var(--sky); }
.f-sun { fill: var(--sun); }
.f-petal { fill: var(--petal); }
.f-petal-deep { fill: var(--petal-deep); }
.f-disk { fill: var(--disk); }
.f-kernel { fill: var(--kernel); }
.f-leaf { fill: var(--leaf); }
.f-soil { fill: var(--soil); }
.f-soil-deep { fill: var(--soil-deep); }
.f-cream { fill: var(--cream); }
.edge { stroke: var(--ink); stroke-width: 5px; stroke-linejoin: round; }
.edge-thin { stroke: var(--ink); stroke-width: 3px; stroke-linejoin: round; }
.ring { fill: none; stroke: var(--ink); stroke-width: 7px; stroke-linecap: round; stroke-dasharray: 0 26; }
.stem-edge { fill: none; stroke: var(--ink); stroke-width: 34px; stroke-linecap: round; }
.stem { fill: none; stroke: var(--leaf); stroke-width: 22px; stroke-linecap: round; }
.root { fill: none; stroke: var(--cream); stroke-width: 4px; stroke-linecap: round; }
.vein { fill: none; stroke: var(--ink); stroke-width: 3.5px; stroke-linecap: round; }
.stripe { fill: none; stroke: var(--cream); stroke-width: 3px; stroke-linecap: round; }
/* Lettering is drawn in three passes (shadow, outline, face) so touching letters share one outline, same weight as the drawing */
.type-shade, .type-edge { fill: var(--ink); stroke: var(--ink); stroke-width: 10px; stroke-linejoin: round; }
.t-cream { fill: var(--cream); }
.t-petal { fill: var(--petal); }
.t-leaf { fill: var(--leaf); }

/* Controls */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.poem { margin: 0; min-width: 0; font: 600 clamp(21px, 3vw, 28px)/1.2 var(--display); text-wrap: balance; }
.end { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.hint { margin: 0; font: 700 14px/1.4 var(--ui); opacity: .8; }
.hint kbd {
  font: 800 12px/1 var(--ui);
  border: 2px solid var(--page-ink); border-radius: 6px;
  padding: 2px 6px;
}
.replay {
  font: 800 16px/1 var(--ui);
  letter-spacing: .02em;
  color: var(--page);
  background: var(--page-ink);
  border: 3px solid var(--page-ink);
  border-radius: 999px;
  padding: 12px 22px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}
.replay:hover { transform: translateY(-2px); box-shadow: 0 4px 0 var(--petal-deep); }
.replay:focus-visible { outline: 3px solid var(--page-ink); outline-offset: 4px; }

@media (max-width: 560px) {
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .replay { transition: none; }
}
</style>

<main class="wrap">
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1600 900" role="img" aria-label="A seed so small became so tall. A seed drops into the soil, sprouts, and grows into a tall sunflower.">

      <g id="world">
        <g id="sun">

            <g id="petals-back"></g>
            <g id="petals-front"></g>
            <circle class="f-disk edge" id="disk" r="66"/>
            <g id="kernels"></g>
          </g>
        </g>
        <g id="seed">
          <g id="seed-low">
            <path class="f-disk edge" d="M-28,0 C-28,15 -8,16 28,0 Z"/>
            <path class="stripe" d="M-17,6 C-6,9 8,7 18,2"/>
          </g>
          <g id="seed-top">
            <path class="f-disk edge" d="M-28,0 C-28,-15 -8,-16 28,0 Z"/>
            <path class="stripe" d="M-17,-6 C-6,-9 8,-7 18,-2"/>
          </g>
        </g>
        <g id="dirt"></g>
      </g>
    </svg>
  </div>

  <div class="bar">
    <p class="poem">A seed so small became so tall 🌻</p>
    <div class="end">
      <p class="hint">Click the picture or press <kbd>R</kbd> to replay</p>
      <button class="replay" type="button" id="replay">Play again</button>
    </div>
  </div>
</main>

  // point by point toward another cut of the same letter. Points above `cut` are lifted by `grow` and moved
  // sideways by `lean`: that lengthens a straight stem and leaves the rest of the letter exactly as drawn.
  function outline(g, k, to, u, cut, grow, lean) {

  }

  function build() {
    const world = $('world');

    /* ---------- Timeline (seconds) ---------- */
    const T = {
      words: [0.35, 0.72, 1.25, 1.6], // A · seed · so · small, each word sown a letter at a time
      fall: 0.42,
      shrink: 2.4,
      drop: 3.15, land: 3.77,
      crack: 4.5,
      sprout: 4.75, surface: 5.2, top: 8.45,
      pull: 5.1, pullFor: 2.4,
      became: 6.55, so: 7.2, tall: 7.5, grow: 7.95,
      bloom: 8.3,
      kernels: 9.25,
      end: 10.9
    };

    /* ---------- Layout ---------- */
    const GROUND = 728;        // soil surface
    const ROWS = [800, 872];   // baselines of the buried line, set in two rows
    const BASE2 = GROUND - 2;  // baseline of the line that grows out of the soil
    const K1 = 0.074, TINY = 0.42, X1 = 80;
    const TALL = 1.75;         // "tall" is set this much bigger than the rest of its line
    const GROW = 820;          // how far its stems grow, in em units: about three x-heights tall in all
    const CUT = { t: -540, l: -420 }; // heights (em units) inside the straight part of each stem

    const SX = tinyLeft + penS[penS.length - 1] * KS + 40;  // the seed, and the stem that grows out of it
    const SY = ROWS[1] - 13;
    const HX = SX + 14, HY = 252, HEAD = 1.12;               // flower head

    const lay1 = typeLayers($('line1')), line1 = [], lrand = rng(3);
    let word = 0, j = 0;
    for (let i = 0; i < TEXT1.length; i++) {
      const ch = TEXT1[i];
      if (ch === ' ') { word++; j = 0; continue; }
      const g = GLYPHS.bold[ch];
      const L = { g: g, j: j, x: rowX(i) + g.adv / 2 * K1, base: ROWS[i >= iRow2 ? 1 : 0], t0: T.words[word] + j * 0.05, spin: (lrand() - 0.5) * 40, el: letter(lay1, 't-cream') };
      if (i >= iSmall) {

        L.xTiny = tinyLeft + (penS[i - iSmall] + L.light.adv / 2) * KS;
      }
      L.el.set(outline(g, K1));
      L.el.hide();
      line1.push(L);
      j++;
    }

    // "became so tall", fitted between the stem and the right edge
    const X2 = SX + 88, RIGHT = 1548;
    const penB = PEN.bold['became so'], penT = PEN.bold.tall, penN = PEN.narrow.tall;
    const SPACE = penB[7] - penB[6];
    const K2 = (RIGHT - X2) / (penB[penB.length - 1] + SPACE + penT[penT.length - 1] * TALL), KT = K2 * TALL;
    const XT = X2 + (penB[penB.length - 1] + SPACE) * K2;
    const SEED_CY = BASE2 - 380 * K2;  // a little above the middle of the x-height
    const lay2 = typeLayers($('line2')), seedsG = el('g', {}, $('line2')), line2 = [];

    const SEED_BODY = 'M-28,0 C-28,-15 -8,-16 28,0 C-8,16 -28,15 -28,0 Z';

      L.el.set(outline(L.g, L.k));
      L.el.hide();

      }

    const soilG = $('soil'), rand = rng(7);

    const TUFT = 'M-14,4 C-14,-6 -20,-16 -24,-22 C-12,-16 -6,-9 -4,-2 C-4,-14 -2,-25 2,-33 C6,-23 6,-12 4,-2 C8,-9 14,-17 24,-21 C18,-13 14,-5 14,4 Z';

    /* ---------- Seed and roots ---------- */

    const roots = [
      [-6, 10, -15, 28, -9, 44, -19, 62],

    /* ---------- Stem ---------- */
    const stemD = 'M' + SX + ',' + (SY - 4) + ' C' + (SX - 6) + ',718 ' + (SX + 14) + ',638 ' + (SX + 5) + ',548' +
      ' C' + (SX - 4) + ',456 ' + (SX - 16) + ',368 ' + (SX + 1) + ',308' +
      ' C' + (SX + 8) + ',280 ' + HX + ',268 ' + HX + ',' + HY;
    const stemEdge = $('stem-edge'), stem = $('stem');
    stemEdge.setAttribute('d', stemD);
    stem.setAttribute('d', stemD);
    const LEN = stem.getTotalLength();
    const STEP = 2, N = Math.ceil(LEN / STEP) + 1, PX = new Float32Array(N), PY = new Float32Array(N);
    for (let i = 0; i < N; i++) { const p = stem.getPointAtLength(Math.min(LEN, i * STEP)); PX[i] = p.x; PY[i] = p.y; }
    function at(s) {
      const fi = clamp(s, 0, LEN) / STEP, i = Math.min(N - 2, Math.floor(fi)), u = fi - i;
      const a0 = Math.max(0, i - 3), a1 = Math.min(N - 1, i + 4);
      return { x: lerp(PX[i], PX[i + 1], u), y: lerp(PY[i], PY[i + 1], u), deg: Math.atan2(PY[a1] - PY[a0], PX[a1] - PX[a0]) * 180 / Math.PI };
    }
    function lengthAtY(y) { for (let i = 0; i < N; i++) if (PY[i] <= y) return i * STEP; return LEN; }
    const L_SURF = lengthAtY(GROUND + 2), L_COT = lengthAtY(GROUND - 60);

    // How much stem there is at time t: a slow push through the soil, then up into the sky
    function tipLen(t) {

      const u = prog(t, T.surface, T.top - T.surface);

    }
    function timeAtLen(l) { for (let t = T.sprout; t < T.top; t += 1 / 120) if (tipLen(t) >= l) return t; return T.top; }

    // Seed leaves ride up with the tip, then stay behind just above the soil
    const LEAF = 'M0,0 C24,-40 96,-56 150,-18 C104,14 40,22 0,0 Z';
    const COT = 'M0,0 C10,-14 34,-18 48,-6 C36,8 12,8 0,0 Z';
    const cots = [1, -1].map((dir) => {
      const g = el('g', { transform: 'scale(0)' }, $('leaves'));
      el('path', { class: 'f-leaf edge', d: COT }, g);

    });
    const leaves = [
      { y: 560, dir: 1, rot: -16, phase: 0 },
      { y: 432, dir: -1, rot: -14, phase: 1.7 }

    for (let i = 0; i < 16; i++) {
      el('path', { class: 'f-leaf edge', d: BRACT, transform: 'rotate(' + (i * 22.5 + 11) + ') translate(0 -48)' }, $('bracts'));

    const petals = [];

      }

    for (let i = 0; i < NK; i++) {
      const r = 59 * Math.sqrt((i + 0.6) / NK), a = i * GOLDEN;
      kernels.push({ el: el('circle', { class: 'f-kernel', cx: f(r * Math.cos(a)), cy: f(r * Math.sin(a)), r: 0 }, $('kernels')), r: 1.9 + 1.5 * Math.sqrt(i / NK), t0: T.kernels + 1.3 * i / NK });
    }

    /* ---------- Dirt kicked up ---------- */
    const bits = [], dirtG = $('dirt'), drand = rng(21);
    function burst(x, t0, n, power) {
      for (let i = 0; i < n; i++) {
        const a = (-90 + (drand() - 0.5) * 120) * Math.PI / 180, v = power * (0.5 + drand() * 0.7);
        bits.push({ x: x, y: GROUND - 2, t0: t0, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 3 + drand() * 5, el: el('circle', { class: 'f-soil edge-thin', r: 0 }, dirtG) });
      }
    }

    /* ---------- Camera ---------- */
    // Opens close on the buried line, then pulls back to the whole field once the sprout is up
    const S0 = clamp(1600 / (Math.max(SX + 70, rowX(pen1.length - 1) + 34) - 40), 1.6, 3.6);
    function camera(t) {
      const u = smooth(prog(t, T.pull, T.pullFor));
      const s = Math.pow(S0, 1 - u);
      return { s: s, left: lerp(40, 0, u) };
    }

    // The letters and the seed fall from just above the opening frame and go in with a puff of dirt
    const DROP_Y = 900 - 900 / S0 - 10, SEED_Y0 = DROP_Y - 50;
    const tEntry = T.drop + (T.land - T.drop) * Math.sqrt((GROUND - SEED_Y0) / (SY - SEED_Y0));
    burst(SX + 24 * (1 - (tEntry - T.drop) / (T.land - T.drop)), tEntry, 9, 260);
    burst(SX, T.surface, 14, 360);
    line1.forEach((L) => burst(L.x, L.t0 + T.fall * Math.sqrt((GROUND - DROP_Y) / (L.base - DROP_Y)), 5, 190));

    // The second line keeps its beat, but no letter starts before the camera has it in frame
    const start2 = { 0: T.became, 1: T.so, 2: T.tall }, gap2 = { 0: 0.08, 1: 0.07, 2: 0.07 };
    line2.forEach((L) => {
      L.t0 = start2[L.word] + L.j * gap2[L.word];
      for (let t = L.t0; t < T.end; t += 1 / 60) {
        const c = camera(t);
        if (L.x + 50 < c.left + 1600 / c.s) { L.t0 = t; break; }
      }
      if (L.word === 2) L.tGrow = Math.max(L.t0 + 0.35, T.grow + L.j * 0.1);
      burst(L.x, L.t0 + (L.word === 0 ? 0.02 : 0.06), 4, 150);
    });

    /* ---------- One frame ---------- */
    const sunRing = document.querySelector('#sun .ring'), clouds = $('clouds'), plant = $('plant');
    function render(t, live) {
      const tt = live ? t : 0;
      const idle = live ? smooth(prog(t, T.end - 0.4, 1.6)) : 0;

      const c = camera(t);
      world.setAttribute('transform', 'scale(' + c.s.toFixed(4) + ') translate(' + f(-c.left) + ' ' + f(-(900 - 900 / c.s)) + ')');
      sunRing.setAttribute('transform', 'rotate(' + f(tt * 12) + ' 1010 170)');
      clouds.setAttribute('transform', 'translate(' + f(16 * Math.sin(tt * 0.35)) + ' 0)');

      // The buried line: letters are sown into the soil, "small" shrinks and thins and shivers,
      // and the seed's landing knocks them all up
      line1.forEach((L) => {
        if (t < L.t0) { L.el.hide(); return; }
        const u = prog(t, L.t0, T.fall), k = settle(t - L.t0 - T.fall);
        let x = L.x, y = lerp(DROP_Y, L.base, u * u), sc = 1;
        if (L.light) {
          const m = smooth(prog(t, T.shrink + L.j * 0.03, 0.55));
          if (m !== L.m) { L.m = m; L.el.set(outline(L.g, K1, L.light, m)); }
          sc = lerp(1, TINY, m);
          x = lerp(L.x, L.xTiny, m);
          const sh = prog(t, T.shrink + 0.6, 0.6);
          if (sh > 0 && sh < 1) x += 2.2 * Math.sin(t * 70 + L.j * 2) * (1 - sh);
        }
        const hop = t - T.land - (SX - x) / 1400;
        if (hop > 0 && hop < 0.32) y -= 14 * Math.sin(Math.PI * hop / 0.32);
        L.el.move('translate(' + f(x) + ' ' + f(y) + ') rotate(' + f(L.spin * (1 - u)) + ') scale(' + f(sc * (1 + 0.16 * k)) + ' ' + f(sc * (1 - 0.2 * k)) + ')');
      });

      // The seed: falls, lands, wiggles, cracks open
      if (t < T.drop) seedG.setAttribute('transform', 'scale(0)');
      else {
        let x = SX, y = SY, rot = -28, sx = 1, sy = 1, open = 0;
        if (t < T.land) {
          const u = prog(t, T.drop, T.land - T.drop);
          y = lerp(SEED_Y0, SY, u * u);
          x = SX + 24 * (1 - u);
          rot = -28 + 250 * (1 - u);
        } else {
          const a = t - T.land, k = Math.exp(-a * 9) * Math.cos(a * 26);
          sx = 1 + 0.22 * k; sy = 1 - 0.28 * k;
          const w = prog(t, T.crack - 0.55, 0.55);
          if (w > 0 && w < 1) rot += 9 * Math.sin(w * Math.PI * 6) * Math.sin(w * Math.PI);
          open = easeOutBack(prog(t, T.crack, 0.35));
        }
        seedG.setAttribute('transform', 'translate(' + f(x) + ' ' + f(y) + ') rotate(' + f(rot) + ') scale(' + f(sx) + ' ' + f(sy) + ')');
        seedTop.setAttribute('transform', 'rotate(' + f(-24 * open) + ' -28 0)');
      }
      roots.forEach((r, i) => {
        const u = easeOut(prog(t, T.crack + 0.15 + i * 0.12, 0.9));
        r.el.style.strokeDashoffset = f(r.len * (1 - u));
        r.el.style.visibility = u > 0 ? 'visible' : 'hidden';
      });

      // The stem draws itself up to the tip
      const l = tipLen(t);
      const dash = f(l) + ' ' + f(LEN + 40);
      stemEdge.style.strokeDasharray = dash; stem.style.strokeDasharray = dash;
      stemEdge.style.visibility = stem.style.visibility = l > 0.5 ? 'visible' : 'hidden';
      const sway = idle * 1.1 * Math.sin(tt * 0.9);
      plant.setAttribute('transform', 'rotate(' + f(sway) + ' ' + SX + ' ' + (SY - 4) + ')');

      const pc = at(Math.min(l, L_COT));
      const cs = easeOut(prog(t, T.sprout + 0.05, 0.4));
      const ca = lerp(-80, -14, smooth(prog(t, T.surface + 0.05, 0.6)));
      cots.forEach((C) => {
        C.g.setAttribute('transform', 'translate(' + f(pc.x) + ' ' + f(pc.y) + ') scale(' + C.dir + ' 1) rotate(' + f(ca) + ') scale(' + f(cs) + ')');
      });
      leaves.forEach((Lf) => {
        const k = easeOutBack(prog(t, Lf.t0, 0.7));
        const flutter = idle * 3 * Math.sin(tt * 1.3 + Lf.phase);
        Lf.g.setAttribute('transform', 'translate(' + f(Lf.x) + ' ' + f(Lf.y) + ') scale(' + Lf.dir + ' 1) rotate(' + f(Lf.rot + (1 - k) * 40 + flutter) + ') scale(' + f(Math.max(0, k)) + ')');
      });

      // The head: a green bud riding the tip, then it opens and turns to the sun
      const tip = at(l);
      const bloom = prog(t, T.bloom, 0.6);
      const hs = lerp(0.3 * smooth(prog(l, L_COT, 60)), HEAD, easeOutBack(bloom));
      const tilt = lerp(tip.deg + 90, 8, smooth(bloom)) + idle * 2.2 * Math.sin(tt * 0.9 - 0.8);
      head.setAttribute('transform', 'translate(' + f(tip.x) + ' ' + f(tip.y) + ') rotate(' + f(tilt) + ') scale(' + f(hs) + ')');
      petals.forEach((P) => {
        const k = easeOutBack(prog(t, P.t0, 0.5));
        P.el.setAttribute('transform', 'rotate(' + f(P.a + idle * 1.5 * Math.sin(tt * 2 + P.a)) + ') translate(0 -50) scale(' + f(Math.max(0, k)) + ')');
      });
      disk.setAttribute('transform', 'scale(' + f(easeOutBack(prog(t, T.bloom + 0.3, 0.5))) + ')');
      kernels.forEach((K) => { K.el.setAttribute('r', f(K.r * easeOutBack(prog(t, K.t0, 0.2)))); });

      // "became": seeds hop out of the soil and flip over into letters.
      // "so" springs up out of the ground; "tall" does too, then its stems grow like stalks and it narrows.
      line2.forEach((L) => {
        const a = t - L.t0;
        if (L.word === 0) {
          if (a > 0 && a < 0.42) {
            const r = easeOutBack(prog(a, 0, 0.3)), flip = 1 - smooth(prog(a, 0.3, 0.12));
            L.seed.setAttribute('transform', 'translate(' + f(L.x) + ' ' + f(lerp(GROUND + 34, SEED_CY, r)) + ') rotate(' + f(-80 * (1 - r)) + ') scale(' + f(0.9 * flip) + ' 0.9)');
          } else L.seed.setAttribute('transform', 'scale(0)');
          if (a < 0.42) { L.el.hide(); return; }
          const k = settle(a - 0.62);
          L.el.move('translate(' + f(L.x) + ' ' + BASE2 + ') scale(' + f(easeOutBack(prog(a, 0.42, 0.2)) * (1 + 0.08 * k)) + ' ' + f(1 - 0.1 * k) + ')');
          return;
        }
        if (a <= 0) { L.el.hide(); return; }
        const y = BASE2 + (1 - easeOutBack(prog(a, 0, 0.45))) * 950 * L.k;
        const k = settle(a - 0.45);
        let x = L.x;
        if (L.word === 2) {
          const g = t - L.tGrow, n = smooth(prog(g, 0, 0.7));
          const lean = (g > 0 ? 90 * Math.exp(-g * 3) * Math.sin(g * 9 + L.j) : 0) + idle * 70 * Math.sin(tt * 1.6 - L.j * 0.7);
          const grow = GROW * spring(g);
          const key = grow.toFixed(1) + ' ' + n.toFixed(3) + ' ' + lean.toFixed(1);
          if (key !== L.key) { L.key = key; L.el.set(outline(L.g, KT, L.n, n, L.cut, grow, lean)); }
          x = lerp(L.x, L.xN, n);
        }
        L.el.move('translate(' + f(x) + ' ' + f(y) + ') scale(' + f(1 + 0.12 * k) + ' ' + f(1 - 0.15 * k) + ')');
      });

      bits.forEach((b) => {
        const a = t - b.t0, y = b.y + b.vy * a + 550 * a * a;
        const on = a > 0 && a < 1.1 && y < GROUND + 4;
        b.el.setAttribute('r', on ? f(b.r * (1 - a / 1.1)) : 0);
        if (on) { b.el.setAttribute('cx', f(b.x + b.vx * a)); b.el.setAttribute('cy', f(y)); }
      });
    }

    return { render: render, end: T.end };
  }

  /* ---------- Player ---------- */
  const scene = build();
  let clock = performance.now() + 250;
  const play = () => {
    clock = performance.now() + 250;
    if (reduce) scene.render(scene.end + 1, false);
  };
  $('replay').addEventListener('click', play);
  $('stage').addEventListener('click', play);
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) play();
  });
  if (reduce) scene.render(scene.end + 1, false);
  else {
    (function frame(now) {
      scene.render((now - clock) / 1000, true);
      requestAnimationFrame(frame);
    })(performance.now());
  }
})();
</script>
</body>
</html>
