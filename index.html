<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Twisty Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Sniglet&display=swap">
<style>
/* Layout: one 16:9 playground stage drawn in SVG, with a replay button beneath it.
   Palette: every color lives in these tokens. */
:root {
  --bg: #E7F0EC;
  --stage: #F7FBF9;
  --ink: #1C2A39;
  --muted: #56686E;
  --slide: #FF8A1F;
  --slide-dk: #D9670A;
  --ground: #CFE2D4;
  --on-color: #1C2A39;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --ui: "Sniglet", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1820; --stage: #15232D; --ink: #EAF3EF; --muted: #98ACB2;
    --slide: #FF9636; --slide-dk: #C4600F; --ground: #21343B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1820; --stage: #15232D; --ink: #EAF3EF; --muted: #98ACB2;
  --slide: #FF9636; --slide-dk: #C4600F; --ground: #21343B;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-inline: 16px;
  box-sizing: border-box;
}
.wrap { width: 100%; max-width: 1100px; display: grid; gap: 14px; }

.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--stage);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* SVG paint, all from tokens */
.ground { fill: var(--ground); }
.rail { fill: var(--ink); opacity: .85; }
.platform { fill: var(--ink); }
.chute-edge { fill: none; stroke: var(--slide-dk); stroke-width: 92; stroke-linecap: round; stroke-linejoin: round; }
.chute { fill: none; stroke: var(--slide); stroke-width: 76; stroke-linecap: round; stroke-linejoin: round; }

.word { font-family: var(--display); fill: var(--ink); font-size: 128px; }
.on-chute { font-family: var(--display); font-size: 58px; fill: var(--on-color); letter-spacing: 2px; }

svg text { transform-box: fill-box; transform-origin: center; }

/* Controls */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
button {
  font: inherit; font-size: 16px;
  color: var(--stage); background: var(--ink);
  border: 2px solid var(--ink); border-radius: 999px;
  padding: 7px 18px; cursor: pointer;
}
button:hover { border-color: var(--slide-dk); }
button:focus-visible, .stage:focus-visible { outline: 3px solid var(--slide); outline-offset: 3px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="stage" id="stage" tabindex="0" aria-label="Poem animation. Click to replay.">
    <svg viewBox="0 0 1600 900" role="img" aria-label="I climb to ride the twisty slide">
      <rect class="ground" x="0" y="820" width="1600" height="80"/>
      <g>
        <rect class="rail" x="468" y="330" width="16" height="490" rx="8"/>
        <rect class="rail" x="574" y="330" width="16" height="490" rx="8"/>
        <rect class="rail" x="712" y="330" width="16" height="490" rx="8"/>
        <rect class="rail" x="468" y="414" width="122" height="12" rx="6"/>
        <rect class="rail" x="468" y="494" width="122" height="12" rx="6"/>
        <rect class="rail" x="468" y="574" width="122" height="12" rx="6"/>
        <rect class="rail" x="468" y="654" width="122" height="12" rx="6"/>
        <rect class="rail" x="468" y="734" width="122" height="12" rx="6"/>
      </g>
      <path class="chute-edge" d="M720,318 C900,298 1010,380 960,480 S760,610 880,690 S1260,760 1560,796"/>
      <path class="chute" id="chute" d="M720,318 C900,298 1010,380 960,480 S760,610 880,690 S1260,760 1560,796"/>
      <rect class="platform" x="448" y="304" width="296" height="28" rx="14"/>

      <text class="word" id="w-i" x="430" y="790" text-anchor="end">I</text>
      <text class="word" id="w-climb" x="430" y="650" text-anchor="end">climb</text>
      <text class="word" id="w-to" x="430" y="510" text-anchor="end">to</text>
      <text class="word" id="w-ride" x="430" y="370" text-anchor="end">ride</text>

      <text class="on-chute" id="t-chute" dominant-baseline="central"><textPath id="tp-chute" href="#chute" startOffset="58%">the twisty slide</textPath></text>
    </svg>
  </div>

  <div class="bar">
    <p class="hint">Click the stage or press R to replay</p>
    <button id="replay" type="button">Replay</button>
  </div>
</main>

<script>
(function () {
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  var running = [], token = 0, chuteEnd, chuteLen;

  function anim(el, kf, opts) {
    if (!el.animate) return;
    var o = { fill: 'backwards' };
    for (var k in opts) o[k] = opts[k];
    running.push(el.animate(kf, o));
  }
  var easeInOut = function (p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };

  // Tween the textPath's startOffset so the words ride down the chute; cancelled on replay.
  function tween(tp, from, to, dur, delay, ease) {
    var my = token, t0 = performance.now() + delay;
    tp.setAttribute('startOffset', from);
    function step(now) {
      if (my !== token) return;
      var p = Math.min(1, Math.max(0, (now - t0) / dur));
      tp.setAttribute('startOffset', from + (to - from) * ease(p));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function play() {
    running.forEach(function (a) { a.cancel(); });
    running = [];
    token++;
    $('tp-chute').setAttribute('startOffset', chuteEnd);
    if (reduce) return;

    // each word climbs one rung higher
    ['w-i', 'w-climb', 'w-to', 'w-ride'].forEach(function (id, i) {
      anim($(id), [
        { transform: 'translateY(150px) scale(.8)', opacity: 0 },
        { transform: 'translateY(-34px) scale(1.04)', opacity: 1, offset: .6 },
        { transform: 'translateY(0) scale(1)', opacity: 1 }
      ], { duration: 640, delay: 300 + i * 520, easing: 'cubic-bezier(.3,.7,.4,1)' });
    });
    // a little wobble at the top before the ride
    anim($('w-ride'), [
      { transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(0)' }
    ], { duration: 520, delay: 2400, fill: 'none' });
    tween($('tp-chute'), -chuteLen - 20, chuteEnd, 2000, 2800, easeInOut);
  }

  function start() {
    chuteLen = $('t-chute').getComputedTextLength();
    chuteEnd = $('chute').getTotalLength() - chuteLen - 40;
    play();
    $('replay').addEventListener('click', play);
    $('stage').addEventListener('click', play);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'r' || e.key === 'R') play();
    });
  }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start, start);
  else start();
})();
</script>
</body>
</html>
